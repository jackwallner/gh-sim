name: QAControl
options:
  bundleIdPrefix: com.jackwallner.qacontrol
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YXG4MP6W39
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
schemes:
  QAControl:
    build:
      targets:
        QAControl: all
        QAControlUITests: [test]
    test:
      targets:
        - QAControlUITests
targets:
  QAControl:
    type: application
    platform: iOS
    sources: [QAControl]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.qacontrol
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  QAControlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - QAControlUITests
      - path: ../FleetQA
    dependencies:
      - target: QAControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackwallner.qacontrol.uitests
        TEST_TARGET_NAME: QAControl
